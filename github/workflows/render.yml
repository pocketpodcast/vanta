name: Render Video with Vanta

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON Payload for Video Generation'
        required: true
        default: '{"text": "MY FIRST AUTO REEL", "subtitle": "Built without writing code!"}'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Render Video
        run: |
          echo "Received JSON payload:"
          echo '${{ github.event.inputs.payload }}'
          
          # Remotion render command jo GitHub actions ke input JSON ko props me pass karegi
          npx remotion render src/index.ts KineticText out/video.mp4 --props='${{ github.event.inputs.payload }}'

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: out/video.mp4
