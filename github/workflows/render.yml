name: Render Video with Vanta

on:
  repository_dispatch:
    types: [render-video]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Render Video
        run: |
          echo "Received payload:"
          # Repository dispatch se data is variable me aata hai
          echo '${{ github.event.client_payload.payload }}'
          
          npx remotion render src/index.ts KineticText out/video.mp4 --props='${{ github.event.client_payload.payload }}'

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: out/video.mp4
